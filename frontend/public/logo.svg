<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo blanco -->
  <rect width="120" height="120" fill="white"/>
  
  <!-- Logo A + Y minimalista -->
  <g stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- A (izquierda) -->
    <line x1="15" y1="90" x2="35" y2="30"/>
    <line x1="55" y1="90" x2="35" y2="30"/>
    <line x1="20" y1="65" x2="50" y2="65"/>
    
    <!-- Y (derecha) -->
    <line x1="65" y1="30" x2="85" y2="55"/>
    <line x1="105" y1="30" x2="85" y2="55"/>
    <line x1="85" y1="55" x2="85" y2="90"/>
  </g>
</svg>